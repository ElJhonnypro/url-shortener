name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: [Deployment]

    steps:
      - name: Update repository
        run: |
          cd ~/Projects/url-shortener
          git pull origin main

      - name: Rebuild application
        run: |
          cd ~/Projects/url-shortner
          docker compose up -d --build
