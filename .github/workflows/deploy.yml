name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: [Deployment]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug files
        run: |
          echo "=== PWD ==="
          pwd

          echo "=== COMMIT ==="
          git rev-parse HEAD

          echo "=== FILES ==="
          find . -maxdepth 3 -type f | sort

          echo "=== GO MOD ==="
          cat go.mod

      - name: Rebuild application
        run: |
          docker compose up -d --build
